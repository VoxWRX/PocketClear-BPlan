[package]
name = "bplan-personal-finance"
version = "1.0.0"
description = "100% Offline, Cross-Platform Multi-Language Desktop Personal Finance App for Beginners"
authors = ["BPlan Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
